{% extends 'base.html' %}

{% block title %}404 Page Not Found | AMS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center p-5">
        <div class="text-primary mb-3">
            <i class="fa-solid fa-compass-drafting fa-4x"></i>
        </div>
        <h2 class="fw-bold">404 - Page Not Found</h2>
        <p class="text-muted mt-2">
            The page or route you requested could not be located on the server.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-semibold">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
