{% extends 'base.html' %}

{% block title %}403 Forbidden - Access Denied | AMS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center p-5">
        <div class="text-danger mb-3">
            <i class="fa-solid fa-shield-virus fa-4x"></i>
        </div>
        <h2 class="fw-bold text-danger">403 - Access Denied</h2>
        <p class="text-muted mt-2">
            You do not have the necessary role permissions to access this administrative or protected resource.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-semibold">
                <i class="fa-solid fa-house me-1"></i> Return to Your Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
