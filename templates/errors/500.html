{% extends 'base.html' %}

{% block title %}500 Internal Server Error | AMS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center p-5">
        <div class="text-danger mb-3">
            <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
        </div>
        <h2 class="fw-bold">500 - Server Error</h2>
        <p class="text-muted mt-2">
            An unexpected error occurred while processing your request. Please try again or contact the administrator.
        </p>
        <div class="mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-semibold">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
